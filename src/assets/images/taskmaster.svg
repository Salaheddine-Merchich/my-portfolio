  <rect width="400" height="300" rx="20" fill="#1E293B" fill-opacity="0.5"/>
  
  <!-- Kanban Board -->
  <rect x="50" y="50" width="300" height="200" rx="10" fill="#0F172A" stroke="#334155" stroke-width="4"/>
  <line x1="150" y1="50" x2="150" y2="250" stroke="#334155" stroke-width="2"/>
  <line x1="250" y1="50" x2="250" y2="250" stroke="#334155" stroke-width="2"/>
  
  <!-- Kanban Cards -->
  <rect x="65" y="70" width="70" height="40" rx="4" fill="#1E293B" stroke="#6366F1" stroke-width="2"/>
  <rect x="165" y="90" width="70" height="40" rx="4" fill="#1E293B" stroke="#818CF8" stroke-width="2"/>
  <rect x="265" y="130" width="70" height="40" rx="4" fill="#1E293B" stroke="#22C55E" stroke-width="2"/>
  
