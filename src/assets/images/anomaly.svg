<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" rx="20" fill="#1E293B" fill-opacity="0.5"/>
  
  <!-- Dashboard Screen -->
  <rect x="60" y="60" width="280" height="180" rx="10" fill="#0F172A" stroke="#334155" stroke-width="4"/>
  <rect x="60" y="60" width="280" height="30" rx="10" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  
  <!-- Glowing Warning Shield -->
  <path d="M200 100L250 120V170C250 200 200 220 200 220C200 220 150 200 150 170V120L200 100Z" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-width="4">
    <animate attributeName="stroke-opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
  </path>
  <path d="M200 130V170M200 185H200.01" stroke="#EF4444" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Checklist Tracking -->
  <rect x="270" y="110" width="50" height="110" rx="4" fill="#1E293B" stroke="#475569" stroke-width="2"/>
  <path d="M280 130L285 135L295 125" stroke="#22C55E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M280 160L285 165L295 155" stroke="#22C55E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="280" y="190" width="15" height="15" rx="2" stroke="#94A3B8" stroke-width="2"/>
  
  <!-- Small Status Updates -->
  <rect x="80" y="110" width="60" height="8" rx="4" fill="#334155"/>
  <rect x="80" y="130" width="40" height="8" rx="4" fill="#334155"/>
</svg>
