<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" rx="20" fill="#1E293B" fill-opacity="0.5"/>
  
  <!-- Toll Booth -->
  <rect x="220" y="80" width="100" height="160" rx="4" fill="#334155"/>
  <rect x="210" y="70" width="120" height="20" rx="4" fill="#1E293B"/>
  <rect x="235" y="100" width="70" height="50" rx="2" fill="#0EA5E9" fill-opacity="0.3" stroke="#0EA5E9" stroke-width="2"/>
  
  <!-- Car -->
  <path d="M60 220C60 210 70 200 85 200H175C190 200 200 210 200 220V240H60V220Z" fill="#6366F1"/>
  <rect x="75" y="215" width="30" height="15" rx="4" fill="#C7D2FE"/>
  <rect x="155" y="215" width="30" height="15" rx="4" fill="#C7D2FE"/>
  
  <!-- Payment Reader & Hand -->
  <rect x="235" y="170" width="50" height="40" rx="4" fill="#0F172A" stroke="#94A3B8" stroke-width="2"/>
  <rect x="245" y="180" width="30" height="5" rx="1" fill="#22C55E"/>
  
  <!-- Hand holding card -->
  <rect x="200" y="185" width="45" height="25" rx="2" fill="#818CF8" transform="rotate(-15 200 185)"/>
  <path d="M170 200C170 200 185 195 195 195C205 195 210 205 210 205" stroke="#FDE047" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Digital Counter -->
  <rect x="230" y="40" width="80" height="30" rx="4" fill="#000"/>
  <text x="245" y="62" fill="#22C55E" font-family="monospace" font-weight="bold" font-size="20">12.50</text>
</svg>
